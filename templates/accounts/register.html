{% extends 'base.html' %}

{% block title %}রেজিস্ট্রেশন (Register) | {{ BRAND_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white rounded-3xl p-8 border border-gray-100 shadow-xl space-y-6">
        
        <div class="text-center space-y-2">
            <span class="font-brand-serif text-3xl font-bold text-brand-emerald">{{ BRAND_NAME }}</span>
            <h1 class="text-xl font-bold text-gray-900">নতুন অ্যাকাউন্ট তৈরি করুন</h1>
            <p class="text-xs text-gray-500">বিশেষ ছাড়, ডিসকাউন্ট ও দ্রুত অর্ডারের সুবিধা পান</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">পূর্ণ নাম *</label>
                <input type="text" name="full_name" required placeholder="যেমন: আহমেদ সাব্বির"
                       class="w-full text-xs p-3 rounded-xl border border-gray-200 outline-none focus:border-brand-emerald">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">ইউজারনেম *</label>
                <input type="text" name="username" required placeholder="sabbir26"
                       class="w-full text-xs p-3 rounded-xl border border-gray-200 outline-none focus:border-brand-emerald">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">মোবাইল নম্বর *</label>
                <input type="tel" name="phone" required placeholder="01XXXXXXXXX"
                       class="w-full text-xs p-3 rounded-xl border border-gray-200 font-mono outline-none focus:border-brand-emerald">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">ইমেইল ঠিকানা</label>
                <input type="email" name="email" placeholder="sabbir@example.com"
                       class="w-full text-xs p-3 rounded-xl border border-gray-200 outline-none focus:border-brand-emerald">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">পাসওয়ার্ড *</label>
                <input type="password" name="password" required placeholder="কমপক্ষে ৬ ক্যারেক্টার"
                       class="w-full text-xs p-3 rounded-xl border border-gray-200 outline-none focus:border-brand-emerald">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">পাসওয়ার্ড নিশ্চিত করুন *</label>
                <input type="password" name="confirm_password" required placeholder="একই পাসওয়ার্ড লিখুন"
                       class="w-full text-xs p-3 rounded-xl border border-gray-200 outline-none focus:border-brand-emerald">
            </div>

            <button type="submit" 
                    class="w-full py-3.5 bg-brand-emerald hover:bg-brand-emerald-dark text-white rounded-xl text-xs font-bold uppercase tracking-wider transition shadow-md">
                অ্যাকাউন্ট খুলুন
            </button>
        </form>

        <div class="pt-4 border-t border-gray-100 text-center text-xs text-gray-500">
            <p>ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="{% url 'accounts:login' %}" class="text-brand-emerald font-bold hover:underline">লগইন করুন</a></p>
        </div>

    </div>
</div>
{% endblock %}
